<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-label="Schema del cavo di collegamento allo scanner: plug 8 poli e connettore a 9 poli maschio">
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#222}.w{stroke:#222;stroke-width:2;fill:none}.n{fill:#fff;stroke:#222;stroke-width:1.5}.g{fill:#eee;stroke:#aaa;stroke-width:1.5}.x{fill:#777;font-size:12px}.h{font-size:11px;text-anchor:middle;dominant-baseline:middle}.t{font-weight:bold;text-anchor:middle}</style>
<rect x="10" y="30" width="230" height="340" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
<rect x="470" y="30" width="160" height="340" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
<text x="125" y="20" class="t">Plug 8 poli (AUX1)</text>
<text x="550" y="20" class="t">Scanner (9 poli)</text>
<path class="w" d="M220 60 L500 204"/>
<path class="w" d="M220 132 L500 96"/>
<text x="24" y="64">GND</text>
<text x="24" y="136">RX</text>
<circle class="n" cx="220" cy="60" r="11"/><text x="220" y="60" class="h">1</text>
<circle class="g" cx="220" cy="96" r="11"/><text x="220" y="96" class="h">2</text>
<circle class="n" cx="220" cy="132" r="11"/><text x="220" y="132" class="h">3</text>
<circle class="g" cx="220" cy="168" r="11"/><text x="220" y="168" class="h">4</text>
<circle class="g" cx="220" cy="204" r="11"/><text x="220" y="204" class="h">5</text>
<circle class="g" cx="220" cy="240" r="11"/><text x="220" y="240" class="h">6</text>
<circle class="g" cx="220" cy="276" r="11"/><text x="220" y="276" class="h">7</text>
<circle class="g" cx="220" cy="312" r="11"/><text x="220" y="312" class="h">8</text>
<circle class="g" cx="500" cy="60" r="11"/><text x="500" y="60" class="h">1</text>
<circle class="n" cx="500" cy="96" r="11"/><text x="500" y="96" class="h">2</text>
<circle class="g" cx="500" cy="132" r="11"/><text x="500" y="132" class="h">3</text>
<circle class="g" cx="500" cy="168" r="11"/><text x="500" y="168" class="h">4</text>
<circle class="n" cx="500" cy="204" r="11"/><text x="500" y="204" class="h">5</text>
<circle class="g" cx="500" cy="240" r="11"/><text x="500" y="240" class="h">6</text>
<circle class="g" cx="500" cy="276" r="11"/><text x="500" y="276" class="h">7</text>
<circle class="g" cx="500" cy="312" r="11"/><text x="500" y="312" class="h">8</text>
<circle class="g" cx="500" cy="348" r="11"/><text x="500" y="348" class="h">9</text>
<text x="320" y="398" class="x" text-anchor="middle">Pin 3 (RX) del plug al pin 2 del 9 poli; pin 1 (GND) del plug al pin 5. Gli altri pin non sono collegati.</text>
</svg>
